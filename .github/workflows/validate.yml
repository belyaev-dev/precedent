name: validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      # The server's test fixtures are cards too, and must be valid ones.
      - run: npm ci
      - run: node scripts/validate.mjs mcp/test/fixtures/cards
      - run: npm ci
        working-directory: mcp
      - run: npm run typecheck
        working-directory: mcp
      # Unit tests, then end-to-end tests against the Worker running locally under wrangler dev.
      - run: npm test
        working-directory: mcp
      # Builds the deployable bundle and prints its size. A dry run: nothing is uploaded.
      - run: npm run size
        working-directory: mcp
