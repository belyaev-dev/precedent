# Asks the live site whether it is up, every half hour. A failed run emails the repository's owner, which is the alert.
name: live
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pages answer with their content
        run: |
          set -euo pipefail
          get() { curl --fail --silent --show-error --max-time 20 --retry 2 --retry-delay 5 "https://precedents.dev$1"; }
          get / | grep -q "Give it evidence"
          get /cards | grep -q "records"
          get /cards/notion-2021-postgres-sharding | grep -q "Notion"
          get /sitemap.xml | grep -q "<urlset"
      - name: The MCP address refuses a call without a key, in JSON
        run: |
          set -euo pipefail
          status=$(curl --silent --max-time 20 --retry 2 --output answer.json --write-out '%{http_code}' -X POST https://precedents.dev/api/mcp -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          test "$status" = 401
          grep -q "API key is required" answer.json
      # Needs a key in the PRECEDENT_KEY secret; skipped without one. Listing the tools goes through the key check
      # and the engine, and does not count against the key's monthly calls.
      - name: The MCP address lists its tools for a key
        env:
          PRECEDENT_KEY: ${{ secrets.PRECEDENT_KEY }}
        if: env.PRECEDENT_KEY != ''
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 --retry 2 -X POST https://precedents.dev/api/mcp \
            -H "authorization: Bearer $PRECEDENT_KEY" -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -H 'user-agent: precedent-live-check' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q "precedent_search"
