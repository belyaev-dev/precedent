# Checks the deployed endpoint from outside: the static corpus downloads whole and holds cards, and the MCP
# endpoint returns real records for a fetch and a search. Runs daily, on demand, and when this file or its
# script changes. It makes five requests, so it costs almost none of the quota.
name: live-check
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/live-check.yml", "scripts/live-check.py"]
permissions:
  contents: read
jobs:
  endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/live-check.py https://mcp.precedents.dev
