# Deploys the MCP server whenever what it serves changes on main: the cards, the server, or the tooling
# that builds the corpus. The build validates the cards first and stops on a failure, so a deploy always
# matches a valid cards/. Afterwards the live check confirms the endpoint serves the corpus just built.
name: deploy
on:
  push:
    branches: [main]
    paths:
      - "cards/**"
      - "schema/**"
      - "scripts/**"
      - "mcp/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
# One deploy at a time, in order. A queued run is not cancelled: the newest commit must end up live.
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  production:
    # Never from a fork or a branch: the token below is only ever used on main of this repository.
    if: github.repository == 'belyaev-dev/precedent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm ci
        working-directory: mcp
      - run: npm run typecheck
        working-directory: mcp
      - run: npm test
        working-directory: mcp
      - name: Deploy
        run: npx wrangler deploy --env production
        working-directory: mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: The live endpoint serves the corpus just built
        run: |
          expected=$(node -e "console.log(JSON.parse(require('fs').readFileSync('mcp/public/corpus/corpus.json','utf8')).corpus_version)")
          for attempt in 1 2 3 4 5 6; do
            sleep 10
            if python3 scripts/live-check.py https://mcp.precedents.dev --expect-version "$expected"; then exit 0; fi
          done
          exit 1
