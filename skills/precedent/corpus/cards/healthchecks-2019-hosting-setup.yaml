      - manual failover
      - hot standby postgres
      - do not automate failover
      - multiple hosts in connection string
    tech: [postgres]
  - id: d3
    kind: decision
    topics: [service-boundaries, capacity-cost]
    title: Replace Cloudflare's load balancer with two self-run HAProxy machines
    chosen:
      text: "Two dedicated machines running HAProxy replaced the Cloudflare Load Balancer, with a watchdog script on an external VM that removes unhealthy balancers from DNS."
      locator: "Near: Before going HAProxy, I used Cloudflare Load Balancer"
    rejected: []
    forcing_condition: null
    rationale: null
    worked_before:
      text: "Cloudflare Load Balancer was used before; the author says it performed well on some days and less well on others."
      locator: "Near: Cloudflare was great on some days, and"
    cost_paid:
      text: "It took more work to research, set up and maintain the dedicated load balancer servers."
      locator: "Near: took more work to research, set up,"
    outcome:
      text: "Compared with Cloudflare, the monthly running cost came out similar but slightly lower, HTTP latency as clients see it became much more consistent, and the author gained more control over configuration and more ways to diagnose problems."
      locator: "Near: latencies seen from clients are much more consistent"
    applies_from: null
    aliases:
      - self hosted load balancer
      - haproxy instead of cloudflare
      - load balancer latency inconsistent
      - dns based load balancer failover
    tech: [haproxy, cloudflare]
  - id: d4
    kind: decision
    topics: [service-boundaries, replication-failover]
    title: Drop a dedicated private switch and second network cards for Hetzner's vSwitch
    chosen:
      text: "The author moved off a private network built from a second network card in each server joined by a dedicated switch, and now servers talk to the load balancers over Hetzner's vSwitch."
      locator: "Near: I later moved away from that setup"
    rejected: []
    forcing_condition: null
    rationale:
      text: "With the dedicated switch every server had to sit in the same rack, so no machines could be added once that rack was full, and a single critical switch failure could have taken out every server."
      locator: "Near: servers had to be in the same rack"
    worked_before:
      text: "Early on, Hetzner support fitted two NICs per machine and a dedicated switch; a custom order takes days and costs more."
      locator: "Near: I asked Hetzner support to install two NICs"
    cost_paid: null
    outcome: null
    applies_from: null
    aliases:
      - private network between servers
      - dedicated switch single point of failure
      - same rack limit
    tech: [hetzner]
