  - id: d2
    kind: decision
    topics: [replication-failover]
    title: Fail over the PostgreSQL primary to its hot standby by hand, using a tested procedure
    chosen:
      text: "The database runs as a primary and a hot standby. The failover procedure is tested but the decision to run it is made by the author, and applications with several hosts in their connection strings follow the new primary."
      locator: "Section: Database"
    rejected:
      - option: Fully automated database failover
        reason: "The author says he is not brave enough to automate failover completely."
        locator: "Near: I am not brave enough to completely automate"
    forcing_condition: null
    rationale: null
    worked_before: null
    cost_paid: null
    outcome: null
