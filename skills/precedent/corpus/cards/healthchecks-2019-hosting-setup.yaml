schema: 1
id: healthchecks-2019-hosting-setup
title: One person runs Healthchecks.io on Hetzner bare-metal servers, one role per machine, with no containers or autoscaling
org: Healthchecks.io
system: Hosting and operations setup
architecture:
  text: "Healthchecks.io runs on Hetzner bare-metal machines, each with one role: two HAProxy load balancers, three application servers (Nginx, uWSGI, Django) and a PostgreSQL primary with a hot standby. There are no containers, no autoscaling and nothing serverless."
  locator: "Near: servers, each dedicated to a single role"
components:
  - name: Load balancers
    role: "Two HAProxy machines serve HTTP/2 and IPv6, using ECDSA certificates for modern clients and RSA for old ones. A watchdog script on an external VM removes an unhealthy balancer's DNS records."
    tech: haproxy
    locator: "Section: Load balancers"
  - name: Application servers
    role: "Three machines run Nginx, uWSGI and Django, plus systemd daemons for sending alerts and reports. The load balancers drop an unhealthy or in-maintenance machine from rotation."
    tech: django
    locator: "Section: Application Servers"
  - name: Database
    role: "PostgreSQL 10 on a primary and a hot standby. Applications list several hosts in their connection strings, and failover is a manual decision following a tested procedure. Full daily backups are encrypted and uploaded to S3."
    tech: postgres
    locator: "Section: Database"
  - name: Ping endpoint application
    role: "A small Go application, kept closed source, serves the ping endpoints efficiently."
    tech: go
    locator: "Section: Custom Bits"
  - name: Monitoring
    role: "An agent and hosted dashboard watch the servers, Netdata on each machine helps with specific issues, four VMs elsewhere ping and log everything, and Papertrail aggregates logs and alerts on specific events."
    locator: "Section: Monitoring"
as_of: "2019-08"
