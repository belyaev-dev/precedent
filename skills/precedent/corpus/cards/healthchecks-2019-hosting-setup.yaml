records:
  - id: d1
    kind: decision
    topics: [deployment-rollout, capacity-cost]
    title: Run plain dedicated servers, one role each, with no containers, autoscaling or serverless
    chosen:
      text: "The core runs on Hetzner bare metal with plain servers each dedicated to one role. Provisioning scripts can set up a new machine quickly, but the set of machines rarely changes."
      locator: "Section: A Look at Healthchecks.io Hosting Setup, Summer 2019"
    rejected: []
    forcing_condition: null
    rationale:
      text: "The stated values are that simple, efficient and less are good, and Hetzner's value for money is a large part of why the current pricing is possible."
      locator: "Near: Main values: Simple is good. Efficient is good."
    worked_before: null
    cost_paid: null
    outcome:
      text: "The primary database server had an uptime of 375 days at the time of writing."
      locator: "Near: has an uptime of 375 days"
    applies_from: null
