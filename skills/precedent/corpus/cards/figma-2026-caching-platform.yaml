schema: 1
id: figma-2026-caching-platform
title: Figma puts a stateless in-house Redis proxy and first-party clients in front of ElastiCache to stop connection pressure and thundering herds
org: Figma
system: FigCache, the Redis caching and ephemeral data platform
architecture:
  text: "FigCache is a stateless, RESP-wire-protocol proxy service backed by a fleet of Redis clusters on AWS ElastiCache, complemented by first-party client libraries. It multiplexes commands from far more client connections onto a finite number of outbound connections to Redis."
  locator: "Section: FigCache, our in-house caching service and client ecosystem"
components:
  - name: FigCache proxy service
    role: "A stateless, highly available, horizontally scalable service that proxies client connections to ElastiCache Redis clusters. It is split into a frontend layer for client interaction and a backend layer for command processing and connection multiplexing to storage."
    tech: redis
    locator: "Section: FigCache, our in-house caching service and client ecosystem"
  - name: ResPC frontend framework
    role: "A Go library for building RPC servers over RESP. It holds the server layer, a streaming RESP parser, a schema-driven command parser and a command dispatch layer, and it is the entry point to FigCache's command processing."
    tech: go
    locator: "Section: A native, drop-in replacement"
  - name: Engine tree
    role: "The backend is a dynamically assembled tree of engine nodes. Leaf data engines run commands against Redis, and intermediate filter engines route, block or modify commands first. The tree is a Starlark program rendered to Protobuf configuration."
    tech: starlark
    locator: "Section: Configuration-driven, dynamic engines"
  - name: Fanout filter engine
    role: "Intercepts eligible multi-shard read-only pipelines and runs them as a parallel scatter-gather, so they do not surface to clients as CROSSSLOT errors."
    locator: "Section: Configuration-driven, dynamic engines"
  - name: First-party client libraries
    role: "Opinionated Go, Ruby and TypeScript clients, built as wrappers over the open source Redis clients already in use, giving a baseline feature set and consistent client-side observability."
    tech: redis
    locator: "Section: An opportunity for new foundational technologies"
  - name: ElastiCache Redis clusters
    role: "The storage backends: a fleet of Redis clusters on AWS ElastiCache to which the stateless proxy forwards connections."
    tech: elasticache
    locator: "Section: FigCache, our in-house caching service and client ecosystem"
