      - migrate servers between datacenters with no downtime
      - rebuild network in datacenter
    tech: [evpn-vxlan]
  - id: d2
    kind: decision
    topics: [replication-failover, deployment-rollout]
    title: Run Basecamp 4 active in both datacenters with BGP Anycast and keep other apps active and standby
    chosen:
      text: "Basecamp 4 and the marketing sites run in both datacenters and visitors are routed by BGP Anycast to whichever site is fastest. The other critical apps run in both sites as active and standby, with the option of moving an app over to the other datacenter if catastrophe strikes."
      locator: "Section: Performance and redundancy"
