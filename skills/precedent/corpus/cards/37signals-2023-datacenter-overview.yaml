records:
  - id: d1
    kind: decision
    topics: [deployment-rollout, capacity-cost]
    title: Rebuild both sites as identical footprints on a new network and move every server in about six months
    chosen:
      text: "Working with the hosting provider, 37signals designed and built an identical, future-proofed footprint with a modern network in each site, then moved every server between buildings in Ashburn and between rooms in Chicago."
      locator: "Section: A bit of history"
    rejected: []
    forcing_condition: null
    rationale:
      text: "The Chicago cabinets had become increasingly difficult to work with: relatively low power, two older generations of network gear and over 10 years of accumulated wiring. The Virginia provider was moved away from for a variety of reasons the post does not list."
      locator: "Section: A bit of history"
    worked_before:
      text: "A Chicago site from 2010 and a second site in Virginia from 2012 with another provider served the apps until the move."
      locator: "Section: A bit of history"
    cost_paid:
      text: "The author calls the move quite the undertaking."
      locator: "Section: A bit of history"
    outcome:
      text: "The moves took about six months and caused no customer impact."
      locator: "Section: A bit of history"
    applies_from: null
    curator_notes:
      - "The post says the move off the cloud is finished but gives no reason for it. This card covers only the datacenter footprint it describes."
    aliases:
      - colocation instead of cloud
