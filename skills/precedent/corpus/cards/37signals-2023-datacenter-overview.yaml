schema: 1
id: 37signals-2023-datacenter-overview
title: 37signals serves Basecamp and HEY from about 90 servers in each of two provider-run datacenters
org: 37signals
system: Basecamp, HEY and heritage apps hosting
architecture:
  text: "37signals serves its apps, which have millions of users every day, from two datacenters, one in Ashburn, Virginia and one in Chicago. Both facilities are run by Deft, a provider the company has used for more than a decade."
  locator: "Section: Our datacenters"
components:
  - name: Ashburn and Chicago datacenters
    role: "The two sites that serve every app, including Basecamp, HEY and the older heritage apps, run for 37signals by a hosting provider rather than by the company itself."
    locator: "Section: Our datacenters"
  - name: Server footprint
    role: "Four 48-unit cabinets per site hold a mix of single and double rack unit Dell servers, 20-25 per cabinet and about 90 per site, on 40kw of power per site."
    locator: "Section: Our carbon-neutral physical footprint"
  - name: Network
    role: "Redundant at each layer so any single link or device can fail, using EVPN/VXLAN internally, with external connections to the internet, the other datacenter and AWS over different providers and physical paths."
    locator: "Section: Networking"
  - name: BGP Anycast routing
    role: "Basecamp 4 and the marketing sites run in both datacenters at once, and visitors reach whichever site is fastest for them."
    locator: "Section: Performance and redundancy"
  - name: Active and standby sites
    role: "The other critical apps run in both datacenters in an active and standby arrangement, so an app can be moved over to the other datacenter if catastrophe strikes."
    locator: "Section: Performance and redundancy"
