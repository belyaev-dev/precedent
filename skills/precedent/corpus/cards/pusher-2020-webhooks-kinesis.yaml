schema: 1
id: pusher-2020-webhooks-kinesis
title: Pusher moves Channels webhooks off self-hosted beanstalkd and a Ruby packager to Kinesis, SQS and a Go consumer, with a one-step cutover
org: Pusher
system: Channels webhooks
architecture:
  text: "At the heart of Channels webhooks is a generic event stream on beanstalkd. A packager process turns the events that should lead to a customer webhook into jobs on a send_webhook queue, and sender processes make the HTTP requests to customer servers."
  locator: "Section: Existing Webhook Architecture"
components:
  - name: Stream queue on beanstalkd
    role: "When certain events occur in Channels, a job with the event's details is put on it. It is divided into numbered shards, each its own beanstalkd queue, and a packager must hold a lock to consume a shard."
    tech: beanstalkd
    locator: "Section: Sharding"
  - name: Packager process
    role: "Reads the stream, picks the events that should produce a webhook, builds the body, headers and URL, and also debounces cancelling events and batches similar ones. It is Ruby EventMachine code limited to one core, so several run."
    tech: eventmachine
    locator: "Section: Existing Webhook Architecture"
  - name: send_webhook queue
    role: "Holds ready-to-send webhook jobs on beanstalkd. It is not sharded, because senders are stateless and any number can consume it."
    locator: "Section: Sharding"
  - name: Sender process
    role: "Takes jobs from the send_webhook queue and makes the HTTP request to the customer server."
    locator: "Section: Existing Webhook Architecture"
  - name: Kinesis stream and Go packager
    role: "The replacement for the stream queues. Kinesis streams are sharded by default, and a Go service built on kinsumer, a library that replicates the functionality of the Kinesis Client Library in Go, consumes them. The Client Library handles shard rebalancing and checkpointing."
    tech: kinesis
    locator: "Near: Kinesis streams are sharded by default"
  - name: SQS send queue
    role: "The replacement for the send_webhook queue, which senders consume."
    tech: sqs
    locator: "Near: SQS seemed like a drop in replacement"
