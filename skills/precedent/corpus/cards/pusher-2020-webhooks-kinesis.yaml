records:
  - id: d1
    kind: decision
    topics: [async-processing, datastore-choice]
    title: Replace self-hosted beanstalkd and a Ruby packager with Kinesis, SQS and a Go consumer before the system gave severe problems
    chosen:
      text: "The event stream moved to Kinesis, consumed by a new Go packager service on kinsumer, and the send queue moved to SQS. The publishers and the sender process were changed to match."
      locator: "Section: Implementation and Testing"
    rejected:
      - option: One SQS queue per stream shard
        reason: "Sharding would still be managed in the EventMachine application layer, and resharding would be awkward because SQS queues are not created on demand and would need terraform."
        locator: "Near: Resharding would become more awkward since, unlike beanstalkd"
      - option: Kinesis consumed through the Java Kinesis Client Library from Ruby
        reason: "The library is Java only, so a Ruby client would need the Java multilang daemon in production, adding operational complexity."
        locator: "Near: KCL is only available as a Java library"
    forcing_condition: null
    rationale:
      text: "Self-hosting beanstalkd on EC2 needs expertise and replacing machines is fiddly, whereas the team prefers managed services for parts that are not an important part of its value proposition. EventMachine is stagnating, and the shard balancing is simplistic, so a process can occasionally lock more shards than it can handle and need manual rebalancing."
      locator: "Section: Problems"
    worked_before:
      text: "The beanstalkd and EventMachine design mostly worked well, with nice properties such as independent scaling."
      locator: "Section: Problems"
    cost_paid:
      text: "A gradual rollout was impossible, because having multiple processes consume the event stream at the same time can lead to issues, so everything had to switch from the old system to the new at one time."
      locator: "Section: Migration"
    outcome:
      text: "The authors report the new system is functionally extremely similar to the old one but considerably more performant and more reliable, and that the team no longer worries about replacing beanstalkd machines."
      locator: "Section: Conclusion"
    applies_from: null
    curator_notes:
      - "The post says the issues were not yet severely affecting the platform's stability, so this was a pre-emptive change, considered because moving the existing system to Kubernetes would itself take investment, not a reaction to an outage."
      - "The Kinesis section gives the reasons for that choice: streams are sharded by default and a Client Library style consumer handles rebalancing and checkpointing, promising automatic lossless resharding and better durability. The team also generally favours Go for new services."
    aliases:
      - beanstalkd to kinesis
      - self hosted queue to managed service
      - replace eventmachine
      - webhook pipeline rewrite
      - sqs versus kinesis for sharded stream
    tech: [beanstalkd, kinesis, sqs, go]
  - id: d2
    kind: decision
    topics: [deployment-rollout, delivery-idempotency]
    title: Run the new pipeline alongside the old in production without sending webhooks, then cut over in one configuration change
    chosen:
      text: "During a low traffic period the event publishers wrote to both beanstalkd and Kinesis. The new packager read Kinesis and published to SQS, but nothing consumed SQS, so no webhook went out twice. Later senders read both queues, and a single configuration change moved all publishers to Kinesis."
      locator: "Section: Parallel Publishing"
    rejected: []
    forcing_condition: null
    rationale:
      text: "Most of the issues Channels sees happen at scale, and staging tests looked positive, so the team wanted to see production load on the new service without switching everything over."
      locator: "Section: Implementation and Testing"
    worked_before: null
    cost_paid: null
    outcome:
      text: "The single configuration change switched all publishers from beanstalkd to Kinesis at once, and the authors describe it as anticlimactic: nobody noticed that anything had changed."
      locator: "Near: happily anticlimactic and nobody actually noticed that"
    applies_from: null
    curator_notes:
      - "Before the cutover, the parallel run left the team confident that the new service was stable at the necessary scale and debounced and batched webhooks in broadly the same way as the old system; the cluster was then returned to its starting state, not publishing to Kinesis (Section: Parallel Publishing)."
    aliases:
      - dual publish to shadow pipeline
      - test new queue at production scale
      - cut over in a single config change
      - shadow consumer that does not send
    tech: [kinesis, sqs]
  - id: d3
    kind: decision
    topics: [delivery-idempotency, datastore-partitioning]
    title: Divide the event stream into locked logical shards so that one packager sees all of a channel's events and can debounce them
    chosen:
      text: "The event stream is divided into logical shards, each its own beanstalkd queue, and a packager must obtain a lock to consume a shard, so all events for a channel go to the same packager."
      locator: "Section: Sharding"
    rejected: []
    forcing_condition: null
    rationale:
      text: "Debouncing only works if a channel's events are handled by one packager. Otherwise an event and its cancelling partner could land on different packagers and neither would be dropped."
      locator: "Section: Sharding"
    worked_before: null
    cost_paid:
      text: "The sharding logic is simplistic: a process can win the lock on more shards than it can process, which rarely causes delayed webhooks and needs manual rebalancing, and adding or removing shards needs fiddly configuration changes."
      locator: "Section: Problems"
    outcome: null
    applies_from: null
    aliases:
      - partition events by channel for debouncing
      - lock per stream shard
      - debounce leave and rejoin events
      - shard rebalancing by hand
    tech: [beanstalkd, eventmachine]
