id: fathom-2021-singlestore-database
title: Fathom Analytics drops DynamoDB for one SingleStore database, then fixes connection overhead from per-request Lambda connections
org: Fathom Analytics
system: Pageview ingest and application database
architecture:
  text: "Fathom's ingest point runs on Laravel Vapor and writes pageviews to SQS. SingleStore handles everything else over persistent connections, including tens of thousands of inserts per second, all key/value lookups and application rate limiting."
  locator: "Section: Conquering unscalable infrastructure design"
