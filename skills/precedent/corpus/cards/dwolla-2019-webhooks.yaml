records:
  - id: d1
    kind: decision
    topics: [tenant-isolation, async-processing]
    title: Per-customer SQS queue and Lambda handler replace one shared RabbitMQ queue so slow or heavy customers stop delaying others
    chosen:
      text: "A dedicated SQS queue and Lambda handler for each subscribed customer, with events routed to that customer's queue, results sent to a separate queue for storage, and the send rate configurable per customer."
      locator: "Near: dynamically provision a Simple Queue Service (SQS) queue"
    rejected: []
    forcing_condition:
      text: "On the shared queue, customers sending big payouts and customers whose APIs answered slowly held up webhooks for all others, and adding handlers to drain the backlog pushed parallel webhooks at every customer API, including ones that could not cope."
      locator: "Near: The shared queue meant high-volume customers doing large"
    rationale: null
    worked_before:
      text: "A simple design of one RabbitMQ queue served by a pool of ECS handlers, which called the customer's API and put the result on a second queue for storage, served the company for years."
      locator: "Near: After years of serving us well, we needed"
    cost_paid:
      text: "Because the per-customer handlers are invoked often and scale up and down with load, they hit Lambda cold starts frequently; the old handlers were in Scala, whose cold starts on Lambda are slow, and the new ones are in TypeScript."
      locator: "Near: we run into cold starts often"
    outcome:
      text: "Launched in March, the new design cut peak-load delivery times from minutes to seconds; the post also reports better reliability, lower cost and per-customer configuration."
      locator: "Near: cutting delivery times during peak load from minutes"
    applies_from: null
    curator_notes:
      - "The post says nothing about how many customers or webhooks per second the system handles, so no scale tier is assigned."
      - "The post also advises knowing AWS account limits (Lambda concurrency, CloudFormation stacks) as a general lesson; it does not say Dwolla hit them, so they are not recorded as a cost."
    aliases:
