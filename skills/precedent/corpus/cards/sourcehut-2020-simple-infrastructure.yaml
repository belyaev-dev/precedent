schema: 1
id: sourcehut-2020-simple-infrastructure
title: SourceHut runs a code forge on 10 hand-provisioned servers and about 30 VMs, with no Kubernetes or Docker and independent miniservices
org: SourceHut
system: SourceHut code forge infrastructure
architecture:
  text: "SourceHut runs on 10 dedicated servers and about 30 virtual machines, all provisioned by hand, with no Kubernetes, Docker or CloudFormation. Its application is split into independent miniservices that can fail separately, and many pages make only one or two database round-trips."
  locator: "Near: SourceHut has 10 dedicated servers and about 30"
components:
  - name: Dedicated servers and virtual machines
    role: "The platform's hosts, provisioned by hand. The team prefers Alpine Linux for them, and the average production server has only 20 to 30 packages installed, so no moving parts go unexplained."
    tech: alpine-linux
    locator: "Near: Alpine Linux because it's lightweight and simple"
  - name: Miniservices
    role: "A distributed set of small services, designed so that any one can fail without a total outage."
    locator: "Near: any of our services to fail independently"
  - name: Database access
    role: "Many pages are designed to make only one or two round-trips to the database, which lets those queries be carefully tuned with joins and purpose-built indexes."
    locator: "Near: designed to make only one or two round-trips"
  - name: Email-based collaboration
    role: "Because users collaborate by email, the whole service could be offline without stopping their work, and servers catch up on redelivery when they return."
    locator: "Near: our entire service could be offline without affecting"
  - name: Monitoring
    role: "Monitoring alerts the team to problems before they are serious, and the raw data is exposed through a public Prometheus instance."
    tech: prometheus
    locator: "Near: monitoring which alerts us to problems before"
