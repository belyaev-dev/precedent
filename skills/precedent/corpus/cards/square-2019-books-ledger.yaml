records:
  - id: d1
    kind: decision
    topics: [consistency-transactions, schema-data-migration]
    title: Model money as balanced double-entry journal entries so every cent moved is matched and payouts can be split
    chosen:
      text: "Money is modelled as double-entry journal entries that must balance to zero, with each book holding a running balance. A merchant's payout amount is then a single row, with no group-by over entries, and a payout can be split by any amount."
      locator: "Section: Double Entry Accounting Primitive"
    rejected: []
    forcing_condition:
      text: "The old settlement service strained under more complex products: each payout needed an expensive group-by to compute a merchant's balance, a payment could not be split across payouts, nothing stopped a payout_id being nulled, and data inconsistencies caused customer inquiries and delayed deposits."
      locator: "Section: Problem"
    rationale:
      text: "Double-entry accounting makes you state why a balance changed as well as what changed, and requires every transaction to sum to zero, so any money leaving one book is offset by money arriving in another."
      locator: "Section: Double Entry Accounting Primitive"
    worked_before:
      text: "A settlement service with tables of accounting adjustments, each marked with a payout identifier on settlement, on a SQL database that later got a sharding scheme of its own."
      locator: "Section: Problem"
    cost_paid:
      text: "The meaning of signs was hard for engineers to grasp and took practice, and Square relaxed standard conventions by treating debits as positive and credits as negative."
      locator: "Section: Double Entry Accounting Primitive"
    outcome:
      text: "The author calls the introduction of Books a big success. At the time of writing the service manages about 20TB of data and is run by a small team of three people."
      locator: "Section: Summary"
    applies_from: null
    aliases:
      - ledger instead of settlement tables
      - double entry bookkeeping in sql
      - balances must sum to zero
      - split payments across payouts
      - merchant balance without group by
    tech: [spanner]
  - id: d2
    kind: decision
    topics: [datastore-choice, datastore-partitioning]
    title: Store the ledger in Cloud Spanner, shaping the schema for it, instead of sharding SQL in the application
    chosen:
      text: "The ledger lives in Google Cloud Spanner. To scale horizontally the schema uses UUIDs in place of increasing integers, avoids timestamp hotspots, and interleaves book entries with journal entries."
      locator: "Section: Modeling Double Entry Accounting in SQL"
    rejected:
      - option: Sharding a SQL database in the application, as the old ledger did
        reason: "The old system took considerable effort to shard and then had to deal with cross-shard transactions when two merchants exchanged value."
        locator: "Section: Problem"
    forcing_condition: null
    rationale:
      text: "Spanner is a fully managed, globally distributed SQL database, which spared the team from sharding and from operating a database themselves."
      locator: "Section: Modeling Double Entry Accounting in SQL"
    worked_before: null
    cost_paid:
      text: "The Spanner schema rules took some time and experimentation to get right."
      locator: "Section: Modeling Double Entry Accounting in SQL"
    outcome:
      text: "After trial and error and load testing, the service scales horizontally by adding a few nodes in the Spanner console."
      locator: "Section: Modeling Double Entry Accounting in SQL"
    applies_from: null
    aliases:
      - spanner for a ledger
      - no application level sharding
      - uuid keys to avoid hotspots
      - interleaved tables
      - cross shard transfers between accounts
    tech: [spanner, kubernetes]
  - id: d3
    kind: decision
    topics: [consistency-transactions]
    title: Make journal and book entries append-only and fix mistakes with correcting entries
    chosen:
      text: "Journal entries and book entries are inserted and never updated. A wrong movement is corrected by writing a new entry, and only the books table, which holds the current balance, changes in place."
      locator: "Section: Immutability"
    rejected: []
    forcing_condition: null
    rationale:
      text: "Because balances are cached on the entries, the data sets are effectively append-only, which gives an audit log of everything that ever happened, including mistakes."
      locator: "Section: Immutability"
    worked_before: null
    cost_paid: null
    outcome: null
    applies_from: null
    aliases:
      - append only ledger
      - correcting entries instead of updates
      - audit log of money movements
      - immutable financial records
    tech: [spanner]
