system: Books, an immutable double-entry accounting database service
architecture:
  text: "Books records money movements as double-entry journal entries, each of which must balance to zero, in a Google Cloud Spanner database, and the service leans on Spanner and Google Kubernetes Engine to serve many internal clients and businesses worldwide."
  locator: "Near: Google Cloud Spanner and Google Kubernetes Engine to"
components:
  - name: books table
    role: "One row per book, a named bucket such as Payments, Refunds, Pending Balance or Payouts, with a type, an owner and a running balance that changes only through accounting transactions."
    locator: "Near: this table has one row for each book"
  - name: journal_entries table
    role: "One row is added each time books change value in an accounting transaction, and the entries in a transaction must balance to zero."
    locator: "Near: journal_entries: every time our books change value"
  - name: book_entries table
    role: "Links a journal entry to a book with a debit or credit amount, and keeps a monotonic version counter for each book."
    locator: "Near: book_entries: each row in this table has foreign"
  - name: Shelves
    role: "Tenants. Every secondary index that user data can influence is namespaced by shelf, so internal clients do not clobber each other's workloads."
    locator: "Near: Books models a tenant as a concept called"
  - name: Google Cloud Spanner
    role: "The storage layer, a managed, globally distributed SQL database chosen so the team did not have to shard or maintain the database."
    tech: spanner
    locator: "Section: Modeling Double Entry Accounting in SQL"
