records:
  - id: d1
    kind: decision
    topics: [consistency-transactions, async-processing]
    title: Keep jobs in Postgres so an enqueue commits or rolls back with the work that created it
    chosen:
      text: "The team ran its job queue as a table in its Postgres database, first through the Queue Classic library and later through Que."
      locator: "Section: Locking algorithms"
    rejected: []
    forcing_condition: null
    rationale:
      text: "The author's case for a database queue is transactional consistency: a job inserted by an operation that fails is undone along with it, and workers cannot pick up a job before the inserting transaction has committed."
      locator: "Section: Why put a job queue in Postgres?"
    worked_before: null
    cost_paid:
      text: "The queue became exposed to long-lived transactions elsewhere on the database. The author sees a job queue as the worst case of a problem that any hot Postgres table can suffer, and agrees only in part that Postgres is a poor home for a queue."
      locator: "Section: Lessons learnt"
    outcome:
      text: "The team first hit the queue degradation described in f1 in production, then reproduced it on a test bench to work on fixes."
      locator: "Section: Building a test bench"
    applies_from: null
    curator_notes:
      - The rationale is written as the author's general argument for a database queue, not as a record of this team's original decision. Nothing measured forced the choice, so forcing_condition is empty.
