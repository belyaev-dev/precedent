  - id: f1
    kind: failure
    topics: [datastore-choice, async-processing, dependency-failure]
    title: A long-lived transaction pinned dead rows and made a Postgres job queue run away
    trigger:
      text: "Long-lived transactions on a Postgres database the queue shared with other teams. The author says the problem would have taken much longer to appear had the database not been shared with teams that understood little about what they ran on it."
      locator: "Section: Lessons learnt"
    mechanism:
      text: "While an old transaction stays open, deleted job rows cannot be vacuumed because it might still see them. Lock attempts then scan through ever more dead index entries (100,000 passes per attempt by the end of the test bench run) and every job worked adds another, so locking slows, workers fall behind and the queue grows without bound."
      locator: "Section: Descending the B-tree"
    why_defences_failed:
      text: "Automatic vacuuming is meant to clear dead rows, but a manual vacuum of the queue table in the test bench found 247311 dead row versions that could not be removed yet, because they were possibly still visible to another process."
      locator: "Section: Dead tuples"
    impact:
      text: "In the test bench the time to lock a job climbed from under 0.01 seconds to about 15 times that, 0.1 seconds and above, so workers locked fewer jobs in the same time; left long enough, jobs arrived faster than they were worked and the queue ran away."
      locator: "Section: Slow lock time"
    fix:
      text: "Planned: the author recommends changing how workers lock jobs, which helps but does not cure it, watching for long-lived transactions, and not sharing a database across components or teams. The post does not say which of these were deployed."
      locator: "Section: Summary"
    curator_notes:
      - Every quantified result is from the author's test bench (a producer, a worker and a process that opens a transaction and sits idle). The post gives no figures for the production occurrence, and its opening scenario is a story.
      - The post does not say whether the patched Que, or a supervisor that terminates old transactions, was deployed in production.
    aliases:
      - queue backlog grows while workers look healthy
      - dead tuples cannot be removed
      - vacuum blocked by old transaction
      - idle in transaction
      - job lock time increasing
      - runaway queue
      - table bloat on a hot queue table
      - postgres as a queue
    tech: [postgres, que, queue-classic]
