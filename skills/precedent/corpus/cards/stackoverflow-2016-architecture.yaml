records:
  - id: d1
    kind: decision
    topics: [service-boundaries, capacity-cost]
    title: Serve every Q&A site from one multi-tenant application and keep web servers overprovisioned
    chosen:
      text: "A single application serves all the Q&A sites, while Careers, API v2 and the Mobile API are separate applications. Nine primary web servers are run although fewer are needed."
      locator: "Section: Web Tier (IIS 8.5, ASP.Net MVC 5.2.3, and .Net 4.6.1)"
    rejected: []
    forcing_condition: null
    rationale:
      text: "The author says the large overprovisioning in the web tier is for rolling builds, headroom and redundancy, and promises a fuller explanation in a later post."
      locator: "Section: Web Tier (IIS 8.5, ASP.Net MVC 5.2.3, and .Net 4.6.1)"
    worked_before: null
    cost_paid: null
    outcome:
      text: "After a hardware upgrade in early 2015 and a lot of tuning, only 1 web server is needed to run Stack Overflow. The team has run on one server by accident a few times and it held. The author says it works but does not call it a good idea."
      locator: "Near: we're down to needing only 1 web server"
    applies_from: null
    curator_notes:
      - "The post does not say why Q&A is multi-tenant in one application, only that it is. The figures are for 2016, not the earlier design."
    aliases:
      - one app for many tenants
      - run whole network on one server
      - overprovisioned web tier
      - headroom for rolling deploys
      - monolith serving many sites
    tech: [asp.net, iis, haproxy]
  - id: d2
    kind: decision
    topics: [datastore-choice, capacity-cost]
    title: Use Elasticsearch for search instead of SQL Server full-text search, because SQL CPUs are expensive
    chosen:
      text: "Search runs on Elasticsearch: a 3-node cluster per data center, one index per site, with the service tier indexing items changed since a stored last-position marker, using SQL Server's ROWVERSION as the sequence."
      locator: "Section: Search (Elasticsearch)"
    rejected:
      - option: SQL full-text search
        reason: "CPU on the SQL Server machines costs much more than Elasticsearch, which also offers more features."
        locator: "Section: Search (Elasticsearch)"
      - option: Solr
        reason: "It could not search across many indexes at once, which the network needs, at the time of the decision."
        locator: "Section: Search (Elasticsearch)"
    forcing_condition: null
    rationale:
      text: "Scalability and a better allocation of money."
      locator: "Section: Search (Elasticsearch)"
    worked_before: null
    cost_paid:
      text: "The cluster stays on Elasticsearch 1.4 because moving to 2.x means a major change to types and reindexing everything, and the author lacks time for the migration plan."
      locator: "Section: Search (Elasticsearch)"
    outcome: null
    applies_from: null
    aliases:
      - elasticsearch instead of sql full text
      - search cost on database cpu
      - search across many indexes
      - index from rowversion
    tech: [elasticsearch, sql-server, solr]
  - id: d3
    kind: decision
    topics: [caching]
    title: Cache in two layers, a web-server HTTP cache and Redis, and clear the first layer through Redis pub/sub
    chosen:
      text: "L1 is the HTTP cache on each web server and L2 is Redis. On a miss in both, a server loads from the source and fills both. When one web server removes a value, a Redis pub/sub message clears the other servers' L1 copies."
      locator: "Section: Cache & Pub/Sub (Redis)"
    rejected: []
    forcing_condition: null
    rationale:
      text: "A value one server missed may be found in Redis by the next server, saving a database query or API call."
      locator: "Section: Cache & Pub/Sub (Redis)"
    worked_before: null
    cost_paid: null
    outcome:
      text: "Redis handles about 160 billion operations a month with every instance below 2% CPU, usually much lower."
      locator: "Section: Cache & Pub/Sub (Redis)"
    applies_from: null
    aliases:
      - two level cache
      - local cache plus redis
      - invalidate local caches with pub sub
      - l1 l2 cache
    tech: [redis, protobuf]
  - id: d4
    kind: decision
    topics: [capacity-cost, load-shedding-backpressure]
    title: Push updates to browsers over websockets, which are more efficient than polling, at the cost of load balancer port exhaustion
    chosen:
      text: "Real-time updates such as notifications, vote counts and new answers reach browsers over websockets served by raw sockets on the web tier, using the team's NetGain library."
      locator: "Near: we use websockets to push real-time updates"
    rejected:
      - option: Polling
        reason: "At this scale polling is far less efficient: websockets deliver more data on fewer resources and reach the user sooner."
        locator: "Near: Why websockets? They're tremendously more efficient than polling"
    forcing_condition: null
    rationale: null
    worked_before: null
    cost_paid:
      text: "Ephemeral port and file handle exhaustion on the load balancer are among the issues websockets bring."
      locator: "Near: ephemeral port and file handle exhaustion"
    outcome:
      text: "About 500,000 concurrent websocket connections are open at peak, and some browsers have kept theirs open for over 18 months."
      locator: "Near: about 500,000 concurrent websocket connections open"
    applies_from: null
    aliases:
      - websockets instead of polling
      - half a million concurrent connections
      - ephemeral port exhaustion
      - realtime updates to browsers
    tech: [websockets, netgain, haproxy]
