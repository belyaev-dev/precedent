schema: 1
id: stackoverflow-2016-architecture
title: Stack Overflow serves all Q&A sites from one multi-tenant ASP.NET app on two SQL Server clusters
org: Stack Overflow
system: Stack Overflow and the Stack Exchange network
architecture:
  text: "One multi-tenant ASP.NET application on IIS serves every Q&A site behind HAProxy load balancers. SQL Server is the single source of truth, with Redis, Elasticsearch and a tag engine fed from it, and everything is duplicated in a second data center."
  locator: "Near: The primary Q&A Application itself is multi-tenant"
components:
  - name: HAProxy load balancers
    role: "Terminate TLS and route to backends mostly by host header; also apply rate limiting and record per-request performance metrics from headers sent by the web tier. They hold plenty of memory to cache TLS sessions."
    tech: haproxy
    locator: "Section: Load Balancers (HAProxy)"
  - name: Web tier
    role: "Nine primary IIS servers run Stack Overflow, Careers and the Stack Exchange sites, with two more for dev and the meta sites. The Q&A application is multi-tenant, so one application pool on one server could run the whole Q&A network."
    tech: iis
    locator: "Section: Web Tier (IIS 8.5, ASP.Net MVC 5.2.3, and .Net 4.6.1)"
  - name: Service tier
    role: "Runs internal services behind the web tier, mainly the tag engine (Stack Server) and the Providence API, plus Elasticsearch indexing jobs. Three servers are enough because loading changed posts every 2 minutes should not be repeated by all nine web servers."
    locator: "Section: Service Tier (IIS, ASP.Net MVC 5.2.3, .Net 4.6.1, and HTTP.SYS)"
  - name: Redis
    role: "Two main servers (master and replica) back an L2 cache and a publish and subscribe channel used to clear L1 caches and to feed websockets. Two further servers hold a machine learning instance for recommendations."
    tech: redis
    locator: "Section: Cache & Pub/Sub (Redis)"
  - name: Websockets
    role: "A thin raw-socket layer on the web tier pushes notifications, vote counts and new answers or comments to browsers."
    locator: "Near: we use websockets to push real-time updates"
  - name: Elasticsearch
    role: "Serves site search, related questions and suggestions when asking. Each data center has a 3-node cluster with one index per site, kept current by the service tier."
    tech: elasticsearch
    locator: "Section: Search (Elasticsearch)"
  - name: SQL Server
    role: "The single source of truth for all data in Elasticsearch and Redis. Two clusters, each with one master and replicas in New York and Colorado, hold the Stack Overflow, Sites, PRIZM and Mobile databases in one and everything else, including every other Q&A site, in the other."
    tech: sql-server
    locator: "Section: Databases (SQL Server)"
  - name: Second data center
    role: "Colorado holds a redundant copy of all servers and services for disaster recovery, linked to New York by a 10Gbps MPLS used for data replication."
    locator: "Section: Ground Rules"
as_of: "2016-02"
