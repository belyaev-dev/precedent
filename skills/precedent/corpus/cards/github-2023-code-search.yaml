schema: 1
id: github-2023-code-search
title: GitHub builds Blackbird, its own Rust code search engine, with a 25 TB index sharded by Git blob ID
org: GitHub
system: Code search (Blackbird)
architecture:
  text: "Blackbird is a search engine written from scratch in Rust for code. Kafka carries indexing work to crawlers and then to indexer shards that build ngram indices, and a query service fans each query out to every shard and merges the results."
  locator: "Section: Let’s build an index"
components:
  - name: Kafka
    role: "Delivers events that say what to index, then carries the crawled documents on a second topic whose partitions map to shards, so indexing is decoupled from crawling and message order gives commit-level query consistency."
    tech: kafka
    locator: "Section: Let’s build an index"
  - name: Crawlers and symbol extraction
    role: "Fetch blob content from Git, extract symbols and build the documents to index. Each repository is diffed against its parent in a delta tree, so only blobs unique to it are crawled."
    locator: "Section: Let’s build an index"
  - name: Indexer shards
    role: "Each shard consumes one Kafka partition and builds ngram indices for content, symbols and paths, plus language, owner and repository indices, flushes them to disk, then compacts small indices into larger ones."
    locator: "Section: Let’s build an index"
  - name: Query service
    role: "Parses a user query into a syntax tree and rewrites it with canonical language IDs and permission clauses, sends it to every shard, then merges, re-sorts, double-checks permissions and returns the top 100."
    locator: "Section: Life of a query"
  - name: Redis
    role: "Manages query quotas and caches some access-control data."
    tech: redis
    locator: "Section: Life of a query"
