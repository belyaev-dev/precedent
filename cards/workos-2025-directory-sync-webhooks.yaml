records:
  - id: f1
    kind: failure
    topics: [tenant-isolation, load-shedding-backpressure]
    title: One customer's endpoint outage made deliveries time out, filled the shared worker pool and delayed Directory Sync webhooks for everyone
    trigger:
      text: "A customer that generated a high volume of Directory Sync webhooks had an outage on its own system, so deliveries to it began timing out."
      locator: "Section: What Happened"
    mechanism:
      text: "Timeouts made deliveries fail slowly and be attempted repeatedly, which consumed the capacity of the webhook workers; because Directory Sync delivery used one shared pool, the growing backlog delayed every customer's webhooks."
      locator: "Section: Contributing Factors"
    why_defences_failed: null
    impact:
      text: "Delivery was delayed for all customers. 26 customers had delays over 10 minutes on at least 10% of their webhooks, and the system-wide 90th percentile delay reached 49 minutes."
      locator: "Section: What Happened"
    fix:
      text: "Planned: Directory Sync webhooks are being tested on a new delivery architecture that isolates one customer's delivery failures from others, along with load shedding for high webhook volumes and better alerting for degraded delivery."
      locator: "Section: Future Prevention & Improvements"
    curator_notes:
      - "The Timeline section gives delays from 14:54 UTC on 10 September 2025, a first alert at 16:50, the source found at 17:19 and normal delivery at 17:46. Better alerting is a listed follow-up, but the post does not say why detection or isolation failed, so why_defences_failed is left empty."
      - "The post-mortem describes the isolation architecture as in testing and the load shedding and alerting as intended work, so the fix field reports plans rather than results."
      - "The trigger was a receiver outage, not a fault in the sender; the failure reported is that one receiver's timeouts could use up capacity shared by all customers."
    aliases:
      - one slow customer endpoint delays everyone
      - noisy neighbour webhooks
      - webhook worker starvation
      - timeouts exhaust the worker pool
      - head of line blocking
      - retries to a dead endpoint clog delivery
      - webhook backlog for all customers
