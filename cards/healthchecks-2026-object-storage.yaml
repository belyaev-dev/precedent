system: Ping request body storage (S3-compatible object storage)
architecture:
  text: "Healthchecks.io keeps the first 100kB of each ping request body: tiny bodies go in PostgreSQL, larger ones in S3-compatible object storage. That storage is now Versity S3 Gateway over a Btrfs filesystem on one dedicated server, instead of a managed provider."
  locator: "Near: stores the first 100kB of the request body"
