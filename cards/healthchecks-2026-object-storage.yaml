records:
  - id: d1
    kind: decision
    topics: [datastore-choice, capacity-cost, backup-restore]
    title: Replace managed object storage with Versity S3 Gateway on one server, backed up by rsync, to stop provider slowdowns
    chosen:
      text: "In March 2026 the S3 API moved to Versity S3 Gateway on a dedicated server, storing objects as files on a Btrfs filesystem over two NVMe drives in RAID 1. Application servers reach it over Wireguard. Every two hours rsync copies changes to a backup server."
      locator: "Section: The Setup"
    rejected:
      - option: AWS S3, ruled out in the 2022 evaluation
        reason: "Per-request pricing would be expensive for frequent PutObject calls, and because of the CLOUD Act the data would need encrypting before it was handed over, adding complexity."
        locator: "Section: The Managed Options"
      - option: Self-hosted Minio, SeaweedFS or Garage clusters
        reason: "A production-ready cluster needs automated node setup, tested update and node-replacement procedures, and cluster monitoring, which a one-person team already running Postgres, HAProxy and email wanted to avoid."
        locator: "Section: The Self-Hosted Options"
    forcing_condition:
      text: "Managed providers degraded over time: OVHcloud gave increasing performance and reliability problems, and UpCloud, used from 2024, later had periods where all operations were slow and hit timeouts, with DeleteObjects getting steadily slower."
      locator: "Section: The Managed Options"
    rationale:
      text: "The gateway turns a local filesystem into an S3 server with no separate metadata database, any backup tool can copy the files, and an upgrade is replacing one binary and restarting a systemd service."
      locator: "Section: Versity S3 Gateway"
    worked_before:
      text: "OVHcloud was the first pick, evaluated in 2022 while body offloading was implemented. The author moved to UpCloud in 2024, a clear improvement at first. Each provider later deteriorated."
      locator: "Section: The Managed Options"
    cost_paid:
      text: "Durability now rests on one server and its backups: if both of its drives fail at once, up to 2 hours of ping bodies not yet synced to the backup server could be lost."
      locator: "Near: both drives on the object storage server fail"
    outcome:
      text: "S3 latency dropped and the queue of ping bodies waiting for upload shrank. No availability issues so far, though it had been live only a couple of weeks. Cost rose, since renting a dedicated server costs more than storing about 100GB at a managed provider."
      locator: "Section: The Results"
    applies_from: null
    curator_notes:
      - "The author says this suits the current size, where everything fits on one system, and that many-terabyte needs would complicate it. Object storage is described as less critical than the PostgreSQL database."
    aliases:
      - s3 compatible gateway on a filesystem
      - object storage slow timeouts
    tech: [versity-s3-gateway, btrfs, s3, ovhcloud, upcloud]
