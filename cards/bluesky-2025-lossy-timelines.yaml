schema: 1
id: bluesky-2025-lossy-timelines
title: Bluesky drops some timeline writes for users who follow huge numbers of accounts to stop hot shards, at over a million timeline writes a second
org: Bluesky
system: Following feed timeline fanout
architecture:
  text: "When someone posts, a reference to the post is fanned out to each follower's timeline, a row in a Timelines table in ScyllaDB sharded by user and trimmed on write to a target length. Reads fetch a page of references and hydrate the posts and authors concurrently."
  locator: "Section: Timeline Fanout"
components:
  - name: Fanout service
    role: "Looks up a poster's followers and writes the post reference to each follower's timeline, taking followers a page of 10,000 at a time and finishing a page before fetching the next."
    locator: "Section: Stacking Latencies"
  - name: Timelines table on ScyllaDB
    role: "Holds one partition per user, spread randomly over hundreds of shards and replicated, so tens of thousands of users share each shard. Older references are trimmed when a timeline is written."
    tech: scylladb
    locator: "Section: Hot Shards in Your Area"
  - name: High-follow account cache
    role: "A Redis sorted set of accounts that follow many others, loaded into memory by each fanout instance every 30 seconds, so follow counts can be checked without extra reads on the main database."
    tech: redis
    locator: "Section: Aside on Caching"
  - name: Timeline read path
    role: "Fetches a page of post references for a user, then hydrates the posts and authors concurrently to build the API response."
    locator: "Section: Timeline Fanout"
as_of: "2025-02"
evidence: production
workloads: [feed-fanout]
