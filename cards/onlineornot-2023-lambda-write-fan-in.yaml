    role: "A Lambda triggered via SQS checks each URL. It originally wrote its result straight to the database; it now returns the result through SNS."
    tech: sqs
    locator: "Section: Fixing the issue"
  - name: Batching queue and result-forwarding Lambda
    role: "A second queue batches results arriving from SNS, and a new Lambda receives those batches and writes them to the database."
    tech: sns
    locator: "Section: Fixing the issue"
  - name: RDS Postgres instance
    role: "The one database for the web app and the check results."
    tech: postgres
