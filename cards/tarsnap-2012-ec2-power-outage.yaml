id: tarsnap-2012-ec2-power-outage
title: A power loss in EC2 corrupts Tarsnap's server disk, and rebuilding state from S3 takes nearly 44 hours
org: Tarsnap
system: Tarsnap central server and S3-backed storage
architecture:
  text: "Tarsnap stores all user data in Amazon S3 and keeps only metadata cached on its central server in EC2. The design is meant to survive the loss of everything held on EC2: the data is read back from S3 and the full operation log is replayed."
  locator: "Section: Tarsnap outage"
