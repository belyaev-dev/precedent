schema: 1
id: gitlab-2017-database-outage
title: GitLab.com's primary database is wiped during a manual replica rebuild, and every backup layer turns out to be broken or missing
org: GitLab
system: GitLab.com PostgreSQL database
architecture:
  text: "GitLab.com uses a single PostgreSQL primary and a single secondary in hot-standby mode that is used only for failover. One database therefore handles all the load, which the post calls not ideal and a single point of failure."
  locator: "Section: Database setup"
