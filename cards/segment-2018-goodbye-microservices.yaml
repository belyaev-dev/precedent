schema: 1
id: segment-2018-goodbye-microservices
title: Segment folds over 140 per-destination microservices, queues and repos back into one monolith fed by Centrifuge
org: Twilio Segment
system: Server-side destinations pipeline
architecture:
  text: "After the change, all server-side destinations run in one monolithic service. Centrifuge, which this move inspired, was to replace the individual per-destination queues and be responsible for sending events to that single service."
  locator: "Section: Ditching Microservices and Queues"
components:
  - name: Ingest API and queue
    role: "Takes events, JSON objects from web or mobile apps that describe users and their actions, and puts them on a distributed message queue. This is the original, simple architecture."
    locator: "Section: Why Microservices worked"
  - name: Centrifuge
    role: "Built to replace all the individual destination queues and be responsible for sending events to the single monolithic service. It became the back-end infrastructure for Connections."
    tech: centrifuge
    locator: "Section: Ditching Microservices and Queues"
  - name: Destination service
    role: "One service holding every destination, merged once all destination code lived in a single repo. It mixes CPU- and memory-intensive destinations, its large worker pool absorbs load spikes, and one engineer can deploy it in minutes."
    locator: "Section: Why a Monolith works"
  - name: Traffic Recorder
    role: "A test tool built on yakbak that records each destination test's HTTP requests and responses on the first run and replays them later, with the files checked into the repo."
    tech: yakbak
    locator: "Section: Building a Resilient Test Suite"
as_of: "2018-07"
evidence: production
