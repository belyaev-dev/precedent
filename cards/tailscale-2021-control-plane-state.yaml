title: Tailscale keeps control-plane state in one rewritten JSON file, then moves it to etcd
org: Tailscale
system: Control plane (CONTROL)
architecture:
  text: Tailscale's coordination server, CONTROL, runs as one Go process on one VM. Its data model was held in memory behind one mutex and persisted by writing the whole structure to disk as JSON on every edit, until the move to etcd described here.
  locator: "Section: A bit of backstory from David"
