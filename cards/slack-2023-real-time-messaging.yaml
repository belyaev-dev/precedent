schema: 1
id: slack-2023-real-time-messaging
title: Slack delivers messages worldwide in 500ms through consistent-hashed Channel Servers and multi-region Gateway Servers
org: Slack
system: Real-time messaging service
architecture:
  text: "Slack's real-time layer is four Java services. Stateful in-memory Channel Servers hold channels placed by consistent hashing, Gateway Servers hold the websocket connections, Admin Servers carry messages in from the web app, and Presence Servers track who is online."
  locator: "Section: Server overview"
components:
  - name: Channel Servers
    role: "Stateful, in-memory servers that keep some history of their channels. Each owns a subset of channels chosen by consistent hashing, and sends every message for them to all Gateway Servers subscribed to that channel."
    locator: "Section: Server overview"
  - name: CHARMs (consistent hash ring managers)
    role: "Manage the consistent hash ring for Channel Servers and replace unhealthy ones quickly, with a new one ready to serve in under 20 seconds."
    locator: "Section: Server overview"
  - name: Gateway Servers
    role: "Stateful, in-memory servers that hold users' details and websocket channel subscriptions. They are the interface between clients and Channel Servers, and the only servers deployed across several regions."
    locator: "Section: Server overview"
  - name: Admin Servers
    role: "Stateless, in-memory servers between the web app backend and the Channel Servers. They find the right Channel Server for a message through the consistent hash ring."
    locator: "Section: Server overview"
  - name: Presence Servers
    role: "In-memory servers that track which users are online, with users hashed to individual servers. Clients ask for presence through the websocket, and get notifications only for users visible on screen."
    locator: "Section: Server overview"
  - name: Consul
    role: "Service discovery. Channel Servers and Admin Servers learn the current hash ring configuration by querying it."
    tech: consul
    locator: "Section: Server overview"
  - name: Envoy
    role: "Load balancing and TLS termination for services, including forwarding a client's websocket request to a Gateway Server."
    tech: envoy
    locator: "Section: Slack client set up"
  - name: Webapp backend
    role: "A Hacklang codebase that hosts the APIs clients call. It supplies the user token and websocket set-up details, and Gateway Servers fetch a user's details, including their channels, from it."
    locator: "Section: Slack client set up"
