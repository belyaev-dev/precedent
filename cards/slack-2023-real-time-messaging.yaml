records:
  - id: d1
    kind: decision
    topics: [datastore-partitioning, replication-failover]
    title: Place channels on stateful Channel Servers by consistent hashing so a failed server is replaced in seconds
    chosen:
      text: "Channels are mapped to Channel Servers by hashing the channel ID on a consistent hash ring, and a team's channels are spread across all the servers. A channel can stand for a user, team, enterprise, file, huddle or an ordinary channel."
      locator: "Section: Server overview"
    rejected: []
    forcing_condition: null
    rationale:
      text: "Because each team's channels are spread across every Channel Server, only a small number of teams have channels on any one server, so when a server is replaced only users of those teams' channels see delayed messages."
      locator: "Section: Server overview"
    worked_before: null
    cost_paid: null
    outcome:
      text: "Hash ring managers replace unhealthy Channel Servers quickly, a new one is ready in under 20 seconds, and users of the affected channels see raised message latency for less than 20 seconds."
      locator: "Section: Server overview"
    applies_from: null
    aliases:
      - consistent hashing for stateful servers
      - channel to server mapping
      - replace a chat server quickly
      - spread a tenant across all servers
    tech: [java, consul]
  - id: d2
    kind: decision
    topics: [replication-failover, service-boundaries]
    title: Deploy Gateway Servers in several regions so clients connect nearby, with draining to move users off a failed region
    chosen:
      text: "Gateway Servers, which hold clients' websocket connections, are deployed across multiple regions, while the other servers are not. A draining mechanism switches users from a failed region to the nearest good one."
      locator: "Section: Server overview"
    rejected: []
    forcing_condition: null
    rationale:
      text: "It lets a Slack client quickly connect to a Gateway Server in its nearest region."
      locator: "Section: Server overview"
    worked_before: null
    cost_paid: null
    outcome: null
    applies_from: null
    aliases:
      - websocket gateway per region
      - connect to nearest region
      - region failure draining
      - multi region edge for realtime
    tech: [envoy]
  - id: d3
    kind: decision
    topics: [async-processing]
    title: Send transient events such as typing indicators through the same servers without saving them
    chosen:
      text: "Transient events, such as a user typing, are not persisted in the database. The client sends them over its websocket to a Gateway Server, which routes them through the hash ring to a Channel Server, and from there to every subscribed Gateway Server."
      locator: "Section: Events"
    rejected: []
    forcing_condition: null
    rationale: null
    worked_before: null
    cost_paid: null
    outcome: null
    applies_from: null
    curator_notes:
      - "The post gives no reason for the transient flow. It also says other events, such as reminders and calendar events, cluster at the top of the hour and cause regular spikes in message delivery."
    aliases:
      - typing indicators
      - ephemeral events
      - do not persist transient events
    tech: [websocket]
